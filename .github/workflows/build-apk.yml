name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'website/**'
      - '*.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify submodules
        run: |
          echo "Checking api submodule..."
          if [ -d "api" ] && [ -f "api/manifest.gradle.kts" ]; then
            echo "✅ API submodule initialized successfully"
            cat api/manifest.gradle.kts | head -5
          else
            echo "❌ API submodule not found or incomplete"
            ls -la api/ 2>/dev/null || echo "api directory doesn't exist"
            exit 1
          fi
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Clean and Build Debug APK
        run: |
          ./gradlew clean :manager:assembleDebug --no-daemon --stacktrace --info
      
      - name: Check build output
        run: |
          echo "Build artifacts:"
          find manager/build/outputs/apk -name "*.apk" -type f 2>/dev/null || echo "No APK found"
      
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manager-debug-apk
          path: manager/build/outputs/apk/debug/manager-debug.apk
          retention-days: 30
